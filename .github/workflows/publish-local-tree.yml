name: Publish verified Planet Killer tree
on:
  push:
    branches: [tmp-do-not-use]
    paths: ['.publish-ready']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-do-not-use
          fetch-depth: 0
      - name: Reconstruct verified local tree
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/final-*.txt | base64 --decode > /tmp/planet-killer-head.tar.gz
          echo '2ea8cd6b97ad7625b603da633491906fa0bbde4f4ad48a03a804d2112a3529e5  /tmp/planet-killer-head.tar.gz' | sha256sum -c -
          rm -rf /tmp/planet-killer-tree
          mkdir -p /tmp/planet-killer-tree
          tar -xzf /tmp/planet-killer-head.tar.gz -C /tmp/planet-killer-tree
      - name: Validate reconstructed tree
        shell: bash
        working-directory: /tmp/planet-killer-tree
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          node scripts/check-project.mjs
          node scripts/build.mjs
      - name: Publish as fast-forward child of origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C publish-main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/planet-killer-tree/. .
          git add -A
          git config user.name 'westkitty'
          git config user.email 'andrew.dolby@westcat.ca'
          git commit -m 'Publish Planet Killer visual enhancement build'
          git push origin HEAD:main
