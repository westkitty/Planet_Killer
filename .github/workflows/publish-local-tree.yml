name: Publish verified Planet Killer tree
on:
  push:
    branches: [tmp-do-not-use]
    paths: ['.publish-ready']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-do-not-use
          fetch-depth: 0

      - name: Validate staging source
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          node scripts/check-project.mjs
          node scripts/build.mjs

      - name: Prepare clean publication tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/planet-killer-clean
          mkdir -p /tmp/planet-killer-clean
          rsync -a ./ /tmp/planet-killer-clean/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.publish/' \
            --exclude='.publish-ready' \
            --exclude='.bootstrap' \
            --exclude='dist/'
          test -f /tmp/planet-killer-clean/src/main.js
          test -f /tmp/planet-killer-clean/src/render/webgl/Renderer.js
          test -f /tmp/planet-killer-clean/tests/ui-render.test.mjs
          test -f /tmp/planet-killer-clean/OPERATIONAL_STATE.md
          test ! -e /tmp/planet-killer-clean/.publish
          test ! -e /tmp/planet-killer-clean/.publish-ready
          test ! -e /tmp/planet-killer-clean/.bootstrap
          test ! -e /tmp/planet-killer-clean/.github

      - name: Publish as fast-forward child of origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C publish-main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/planet-killer-clean/. .
          git add -A
          git diff --cached --check
          git config user.name 'westkitty'
          git config user.email 'andrew.dolby@westcat.ca'
          git commit -m 'Reconstruct and publish Planet Killer source tree'
          git push origin HEAD:main
