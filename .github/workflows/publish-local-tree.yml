name: Publish verified Planet Killer tree
on:
  push:
    branches: [tmp-do-not-use]
    paths: ['.publish-ready']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-do-not-use
          fetch-depth: 0
      - name: Reconstruct checksum-locked source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          names = [
              'rebuild-00.hex', 'rebuild-01.hex', 'rebuild-02.hex',
              'rebuild-03a.hex', 'rebuild-03b.hex',
              'rebuild-04a.hex', 'rebuild-04b.hex',
              'rebuild-05a.hex', 'rebuild-05b.hex',
              'rebuild-06a.hex', 'rebuild-06b.hex',
              'rebuild-07a.hex', 'rebuild-07b.hex',
              'rebuild-08a.hex', 'rebuild-08b.hex',
              'rebuild-09a.hex', 'rebuild-09b.hex',
          ]
          parts = [Path('.publish') / name for name in names]
          missing = [str(p) for p in parts if not p.is_file()]
          if missing:
              raise SystemExit('missing publication pieces: ' + ', '.join(missing))
          payload = ''.join(p.read_text().strip() for p in parts)
          Path('/tmp/planet-killer-rebuild.tar.gz').write_bytes(bytes.fromhex(payload))
          PY
          echo '3cf8660a0b17dc16ef003ba4813b30a108cf0bd822b2eedc5e6b39bd42cf466f  /tmp/planet-killer-rebuild.tar.gz' | sha256sum -c -
          rm -rf /tmp/planet-killer-tree
          mkdir -p /tmp/planet-killer-tree
          tar -xzf /tmp/planet-killer-rebuild.tar.gz -C /tmp/planet-killer-tree
      - name: Validate reconstructed tree
        shell: bash
        working-directory: /tmp/planet-killer-tree
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          node scripts/check-project.mjs
          node scripts/build.mjs
      - name: Publish as fast-forward child of origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C publish-main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/planet-killer-tree/. .
          git add -A
          git config user.name 'westkitty'
          git config user.email 'andrew.dolby@westcat.ca'
          git commit -m 'Reconstruct and publish Planet Killer source tree'
          git push origin HEAD:main
      - name: Remove temporary publication branch
        if: success()
        shell: bash
        run: git push origin --delete tmp-do-not-use || true
